# docker-compose.yml — Build Talus from source (local development / self-host build)
#
# Quick Start:
#   1. cp .env.example .env  # fill in DB_PASSWORD / VPSMANAGER_MASTER_KEY / JWT_SECRET
#   2. docker compose up -d --build
#   3. Access at http://localhost:8080 (first login creates the admin account)
#
# Required secrets have no defaults — the stack refuses to start until
# DB_PASSWORD / VPSMANAGER_MASTER_KEY / JWT_SECRET are set (see .env.example).

services:
  # TimescaleDB (PostgreSQL + Timescale extension) — stores servers, metrics, audit logs
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: vpsmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: vpsmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpsmanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Talus hub — compiled from the repository root Dockerfile
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into both the binary and the UI bundle, and surfaced at
        # /api/v1/version. Set a release tag (e.g. v0.12.0) to enable GitHub
        # update checks and the stale-page reload prompt. A changing commit
        # hash enables only the reload prompt; "dev" disables both checks.
        VERSION: ${VERSION:-dev}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://vpsmanager:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/vpsmanager?sslmode=disable
      VPSMANAGER_MASTER_KEY: ${VPSMANAGER_MASTER_KEY:?set VPSMANAGER_MASTER_KEY in .env (openssl rand -hex 32)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_MAX_OPEN_CONNECTIONS: ${DB_MAX_OPEN_CONNECTIONS:-32}
      USAGE_LOG_WRITE_CONCURRENCY: ${USAGE_LOG_WRITE_CONCURRENCY:-4}
      USAGE_LOG_ACTIVE_LIMIT: ${USAGE_LOG_ACTIVE_LIMIT:-4096}
      USAGE_LOG_RETENTION_DAYS: ${USAGE_LOG_RETENTION_DAYS:-30}
      USAGE_LOG_SENSITIVE_RETENTION_DAYS: ${USAGE_LOG_SENSITIVE_RETENTION_DAYS:-90}
      USAGE_LOG_LEGACY_WRITERS_DRAINED: ${USAGE_LOG_LEGACY_WRITERS_DRAINED:-false}
      SYSTEM_SETTINGS_IGNORE_INVALID_OVERRIDES: ${SYSTEM_SETTINGS_IGNORE_INVALID_OVERRIDES:-false}
      AGENT_HUB_URL: ${AGENT_HUB_URL:-}
      AGENT_ALLOW_HTTP: ${AGENT_ALLOW_HTTP:-false}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-5}
      SSH_TIMEOUT: ${SSH_TIMEOUT:-10}
      SSH_MAX_IDLE: ${SSH_MAX_IDLE:-300}
      EXEC_TIMEOUT: ${EXEC_TIMEOUT:-30}
      EXEC_TIMEOUT_MAX: ${EXEC_TIMEOUT_MAX:-300}
      EXEC_OUTPUT_LIMIT: ${EXEC_OUTPUT_LIMIT:-8388608}
      EXEC_OUTPUT_STREAM_LIMIT: ${EXEC_OUTPUT_STREAM_LIMIT:-4194304}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      METRICS_RETENTION_ENABLED: ${METRICS_RETENTION_ENABLED:-false}
      METRICS_RETENTION_DRY_RUN: ${METRICS_RETENTION_DRY_RUN:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: unless-stopped

volumes:
  pgdata:
