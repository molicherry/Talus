name: DSH skill sync

# This independent, lightweight check intentionally has no path filters: the
# main CI workflow ignores Markdown and LICENSE-only changes, but those files
# can change the self-contained skill shipped in the DSH plugin.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dsh-skill-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundled skill matches source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
      - run: node plugins/dsh/scripts/sync-skills.mjs --check
