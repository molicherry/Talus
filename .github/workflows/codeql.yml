name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    # Weekly re-scan so updated query packs catch pre-existing code even
    # without a push.
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload SARIF results to code scanning.
      security-events: write
      # Required to fetch internal or private CodeQL packs.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflow files themselves are scanned too, so a malicious
          # `pull_request_target` pattern cannot land unnoticed.
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
            packs: +codeql/go-queries:AlertSuppression.ql
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      # backend/go.mod requires a Go toolchain the runner image may not have
      # yet; the Go autobuilder needs one that can build the module.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Append the official suppression query for Go. Default security
          # queries stay enabled; the other languages keep their current setup.
          packs: ${{ matrix.packs || '' }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Verify the intended SSH suppression
        if: matrix.language == 'go'
        shell: python
        run: |
          import json
          from pathlib import Path

          source = Path("backend/internal/service/ssh.go")
          line = next(i for i, text in enumerate(source.read_text().splitlines(), 1)
                      if "runErr := session.Run(command)" in text)
          data = json.loads(Path("sarif-results/go.sarif").read_text())
          results = [result for run in data["runs"] for result in run.get("results", [])
                     if result.get("ruleId") == "go/command-injection"]

          def hits_on(result, line_number):
              return [location for location in result.get("locations", [])
                      if location["physicalLocation"]["artifactLocation"]["uri"] == source.as_posix()
                      and location["physicalLocation"].get("region", {}).get("startLine") == line_number]

          # Hard gate: the invariant that protects the host is that no reachable
          # command-injection result is left *unsuppressed*. A stale in-source
          # suppression still shows up here, so this catches a suppression that
          # stopped applying - including on the intentional sink below.
          unsuppressed = [result for result in results if not result.get("suppressions")]
          assert not unsuppressed, (
              "unsuppressed go/command-injection result(s): "
              + json.dumps([hits_on(r, line) or r.get("locations", []) for r in unsuppressed])[:2000])

          # Meta-check, deliberately a warning rather than a gate: it asserts a fact
          # about CodeQL's flow modeling, which changes with the query pack and the
          # shape of the call path. Losing it means the `codeql[go/command-injection]`
          # comment above this sink currently suppresses nothing - a coverage gap to
          # restore, not a vulnerability: the route requires servers:exec plus
          # mw.CheckServerAccess, and the command is the caller's by design.
          at_sink = [result for result in results if hits_on(result, line)]
          if at_sink:
              print(f"modeled flow present at {source.as_posix()}:{line}; the in-source suppression is meaningful")
          else:
              print("::warning title=CodeQL coverage lost for the intentional SSH sink::"
                    f"go/command-injection no longer reports {source.as_posix()}:{line}, so the "
                    "`codeql[go/command-injection]` suppression there suppresses nothing. Follow-up: "
                    "restore the modeled flow (suspect the handler -> sshSvc.Exec -> lease.Exec -> "
                    "runCommand hop added by the execution hardening).")
          for result in results:
              for location in result.get("locations", []):
                  physical = location["physicalLocation"]
                  print("  go/command-injection at "
                        f"{physical['artifactLocation']['uri']}:{physical.get('region', {}).get('startLine')} "
                        f"suppressed={bool(result.get('suppressions'))}")
          assert all(any(item.get("kind") == "inSource" for item in result.get("suppressions", []))
                     for result in at_sink), "The intended SSH result is not suppressed in SARIF"

      # Dismissal is global across branches. Never run this step on a PR.
      - name: Apply source suppressions on the default branch
        if: matrix.language == 'go' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/go.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
