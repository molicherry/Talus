name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    # Weekly re-scan so updated query packs catch pre-existing code even
    # without a push.
    - cron: "30 1 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload SARIF results to code scanning.
      security-events: write
      # Required to fetch internal or private CodeQL packs.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflow files themselves are scanned too, so a malicious
          # `pull_request_target` pattern cannot land unnoticed.
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
            packs: +codeql/go-queries:AlertSuppression.ql
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      # backend/go.mod requires a Go toolchain the runner image may not have
      # yet; the Go autobuilder needs one that can build the module.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Append the official suppression query for Go. Default security
          # queries stay enabled; the other languages keep their current setup.
          packs: ${{ matrix.packs || '' }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Verify the intended SSH suppression
        if: matrix.language == 'go'
        shell: python
        run: |
          import json
          from pathlib import Path

          source = Path("backend/internal/service/ssh.go")
          line = next(i for i, text in enumerate(source.read_text().splitlines(), 1)
                      if "runErr := session.Run(command)" in text)
          data = json.loads(Path("sarif-results/go.sarif").read_text())
          matches = [result for run in data["runs"] for result in run.get("results", [])
                     if result.get("ruleId") == "go/command-injection"
                     and any(location["physicalLocation"]["artifactLocation"]["uri"] == source.as_posix()
                             and location["physicalLocation"].get("region", {}).get("startLine") == line
                             for location in result.get("locations", []))]
          assert matches, "Expected SSH command-injection result missing; review query coverage"
          assert all(any(item.get("kind") == "inSource" for item in result.get("suppressions", []))
                     for result in matches), "The intended SSH result is not suppressed in SARIF"
          print(f"Verified {len(matches)} in-source SSH suppression(s) at {source}:{line}")

      # Dismissal is global across branches. Never run this step on a PR.
      # See docs/codeql-suppression.zh-CN.md for first-time PR triage.
      - name: Apply source suppressions on the default branch
        if: matrix.language == 'go' && github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results/go.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
