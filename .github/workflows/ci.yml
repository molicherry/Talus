name: CI

on:
  pull_request:
    branches: [main]
    # Documentation cannot break the build. Path filters are not evaluated for
    # pushes of tags (GitHub Actions docs), so releases still run in full.
    #
    # `main` has no required status checks today. If it ever gains any, a
    # path-filtered skip leaves this workflow Pending and blocks the merge,
    # so the filter has to be dropped or widened at the same time.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
    tags:
      - "v*"

permissions:
  contents: read

# One run per ref, so a new push to an open pull request cancels its stale run.
# Tag runs are never cancelled: a superseded release build must still finish and
# publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release automation regression tests
        run: node --test tests/release-policy.test.mjs
      - name: Validate annotated tag, message and main ancestry
        if: startsWith(github.ref, 'refs/tags/v')
        run: node .github/scripts/release.mjs validate

  security:
    name: Release security gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-policy
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The startup regression exercises the real entrypoint in a separate
      # database, including the TimescaleDB extension and model migrations.
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        working-directory: backend
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            while IFS= read -r file; do
              echo "::error file=backend/${file#./}::not gofmt-formatted (run: gofmt -w backend)"
            done <<< "$unformatted"
            exit 1
          fi

      # Config lives in backend/.golangci.yml (standard linters + the
      # std-error-handling exclusion preset; see the file for the rationale).
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=5m

      - name: Vet
        run: go vet ./...
        working-directory: backend

      # Runs against the Postgres service above. The repository integration
      # test creates and cleans up its own schema, so it never touches other
      # tables and genuinely executes here instead of skipping.
      - name: Test
        run: go test -race ./...
        working-directory: backend
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable

      - name: Build
        run: go build ./...
        working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must match the runtime the shipped image is built with (see
          # Dockerfile: `node:24-alpine`). This used to be
          # `node-version-file: frontend/package.json`, which was a silent
          # no-op: that file has no engines/volta field, so setup-node fell
          # back to the runner default and only emitted a warning.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test (query layer + i18n locales)
        run: npm test
        working-directory: frontend

      - name: Type-check & Build
        run: npm run build
        working-directory: frontend

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser regressions (production build)
        run: npm run test:ui:built
        working-directory: frontend

  unified:
    name: Unified test entry (tests/run.sh)
    runs-on: ubuntu-latest
    # M3 now includes the image acceptance run, which builds the four final images
    # in this job as well.
    timeout-minutes: 45
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence re-use checks ancestry and diffs against a recorded
          # commit, so the unified job needs full history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The M3 gate includes the image acceptance run: it builds each final image
      # for its own platform and executes the agent inside it, so the arm64 build
      # needs binfmt handlers on this runner too.
      - name: Set up QEMU (M3 builds arm64 images)
        uses: docker/setup-qemu-action@v4

      # The M3 gate runs the ui-charts checks, which drive a real browser.
      - name: Install Playwright chromium for the UI gate
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The manifest is the single machine source; a stale generated report
      # must fail before any runner starts.
      - name: Coverage manifest + report drift
        run: node tests/render-coverage.mjs --check

      # M1 runs adapter checks, migrations and current-source Hub acceptance in
      # temporary databases. It never requires a personal deployment or old Git refs.
      - name: Phase gate M1
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bash tests/run.sh --gate M1

      # Exercise later gates independently of earlier failures; their success
      # never overrides a failed gate.
      - name: Phase gate M2 (race and real terminal protocols)
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bash tests/run.sh --gate M2

      # M3 is the hardening gate and now includes the image acceptance run, so the
      # gate cannot pass while the four final images are never built and executed.
      # The docker job below does the same builds with a warm cache, so this step is
      # redundant on purpose: the gate is only meaningful if it runs the check.
      - name: Phase gate M3 (migrate hardening, agent images)
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bash tests/run.sh --gate M3

      # M4 is the terminal-acceptance gate. Its end-to-end run boots the Hub, its own
      # scratch database and a controlled SSH peer, so the whole browser flow runs here
      # rather than against an externally provided deployment.
      - name: Phase gate M4 (terminal UI, PTY resize, lifecycle)
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: bash tests/run.sh --gate M4

      # The records live in tests/.artifacts, a hidden directory: without
      # include-hidden-files the upload silently finds nothing, and a "successful"
      # upload step then proves nothing (P2-05). Missing records are an error here,
      # not a warning, because the evidence is the point of running the gates.
      - name: Verify the phase-gate execution records exist
        if: ${{ !cancelled() }}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const dir = "tests/.artifacts";
            const files = fs.readdirSync(dir).filter((f) => /^exec-.*\.json$/.test(f));
            if (files.length === 0) {
              console.error("no phase-gate execution records were written");
              process.exit(1);
            }
            const expected = process.env.EXPECTED_COMMIT;
            const gates = new Set();
            for (const file of files) {
              const doc = JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8"));
              // A record from another commit would not describe this run.
              if (expected && doc.commit !== expected) {
                console.error(`${file} records commit ${doc.commit}, expected ${expected}`);
                process.exit(1);
              }
              if (doc.selector && doc.selector.gate) gates.add(doc.selector.gate);
            }
            console.log(`records: ${files.length}, gates: ${[...gates].sort().join(",")}, commit: ${expected.slice(0, 7)}`);
            const missing = ["M1", "M2", "M3", "M4"].filter((gate) => !gates.has(gate));
            if (missing.length > 0) {
              console.error(`missing execution records for: ${missing.join(",")}`);
              process.exit(1);
            }
          '

      - name: Upload phase execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-gate-evidence
          path: tests/.artifacts/exec-*.json
          include-hidden-files: true
          if-no-files-found: error

  docker:
    name: Docker
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both builder stages are pinned to $BUILDPLATFORM and cross-compile, so
      # QEMU is only needed for the final alpine stage: its `apk add` and the
      # agent protocol probe, which executes the TARGETARCH binary (arm64 runs
      # under binfmt, which is exactly the case a native host cannot cover).
      # Only the
      # arch-independent ui-builder is shared between the two targets (one
      # `npm ci` + `npm run build`, and both final stages copy the same
      # /app/dist); go-builder runs once per target platform, natively and in
      # parallel.
      - name: Set up QEMU (only for the final alpine stage's apk add)
        uses: docker/setup-qemu-action@v4

      # Verify what each Hub image actually ships: both agent architectures and
      # the manifest, checked inside the image rather than in the build context.
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Verify the agent artifacts of every image variant (TC-08-05). Each build
      # verifies what it ships — manifest, both architectures, ELF class/machine,
      # size, hash and the stamped version, plus the protocol smoke test for the
      # architecture the builder can execute — so a mismatch fails the build.
      - name: Verify every image variant (2 Dockerfiles × 2 platforms)
        run: |
          set -euo pipefail
          for dockerfile in Dockerfile backend/Dockerfile; do
            for platform in linux/amd64 linux/arm64; do
              echo "=== $dockerfile $platform ==="
              # The artifact stage verifies the manifest, both architectures, ELF
              # class/machine, size, hash and the stamped version; the final stage
              # executes the TARGETARCH agent and checks its protocol output (arm64
              # under the QEMU binfmt registered above).
              docker buildx build --platform "$platform" --target go-builder \
                --build-arg VERSION=ci-agent-check -f "$dockerfile" .
              docker buildx build --platform "$platform" \
                --build-arg VERSION=ci-agent-check -f "$dockerfile" .
            done
          done

      # The gate's own image acceptance run, executed here where the builds above
      # left a warm cache: it builds each final image with the platform's own
      # binary, then re-reads the version and protocol out of the shipped image.
      - name: Agent image acceptance (tests/verify-agent-images.sh)
        run: bash tests/verify-agent-images.sh

      # Export the exact multi-platform index. No registry writes occur here;
      # publish-image copies this archive only after every release gate passes.
      - name: Build Hub (export OCI archive for tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=oci,dest={0}/hub.tar', runner.temp) || '' }}
          tags: talus:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          # Keep BuildKit provenance in the copied index alongside both platforms.
          provenance: mode=min
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Save release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: ${{ runner.temp }}/hub.tar
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  publish-image:
    name: Publish immutable version image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-policy, security, backend, frontend, unified, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: version-image-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image
      - name: Install registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
          REGISTRY_USER: ${{ github.repository_owner }}
        run: printf '%s' "$GH_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
      - name: Publish exact digest, preserving an existing version tag on retries
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: node .github/scripts/release.mjs publish-image "$RUNNER_TEMP/release-image/hub.tar"
      - name: Save release image evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-image-evidence
          path: release-image.json
          overwrite: true
          if-no-files-found: error
      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth.json"

  release-draft:
    name: Create Release draft
    needs: publish-image
    # Internal test tags publish versioned images only.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-test.')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-image-evidence
      - name: Create draft without overwriting reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs draft release-image.json
