name: CI

on:
  pull_request:
    branches: [main]
    # Documentation cannot break the build. Path filters are not evaluated for
    # pushes of tags (GitHub Actions docs), so releases still run in full.
    #
    # `main` has no required status checks today. If it ever gains any, a
    # path-filtered skip leaves this workflow Pending and blocks the merge,
    # so the filter has to be dropped or widened at the same time.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# One run per ref, so a new push to an open pull request cancels its stale run.
# Tag runs are never cancelled: a superseded release build must still finish and
# publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Plain Postgres is enough: the integration test migrates only the
      # servers/ssh_credentials models into a throwaway schema.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check
        working-directory: backend
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            while IFS= read -r file; do
              echo "::error file=backend/${file#./}::not gofmt-formatted (run: gofmt -w backend)"
            done <<< "$unformatted"
            exit 1
          fi

      # Config lives in backend/.golangci.yml (standard linters + the
      # std-error-handling exclusion preset; see the file for the rationale).
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=5m

      - name: Vet
        run: go vet ./...
        working-directory: backend

      # Runs against the Postgres service above. The repository integration
      # test creates and cleans up its own schema, so it never touches other
      # tables and genuinely executes here instead of skipping.
      - name: Test
        run: go test -race ./...
        working-directory: backend
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable

      - name: Build
        run: go build ./...
        working-directory: backend

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Must match the runtime the shipped image is built with (see
          # Dockerfile: `node:24-alpine`). This used to be
          # `node-version-file: frontend/package.json`, which was a silent
          # no-op: that file has no engines/volta field, so setup-node fell
          # back to the runner default and only emitted a warning.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test (query layer + i18n locales)
        run: npm test
        working-directory: frontend

      - name: Type-check & Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both builder stages are pinned to $BUILDPLATFORM and cross-compile, so
      # QEMU is only needed for the final alpine stage's `apk add`. Only the
      # arch-independent ui-builder is shared between the two targets (one
      # `npm ci` + `npm run build`, and both final stages copy the same
      # /app/dist); go-builder runs once per target platform, natively and in
      # parallel.
      - name: Set up QEMU (only for the final alpine stage's apk add)
        uses: docker/setup-qemu-action@v4

      # Nothing is pushed outside a release tag, so the registry is only
      # contacted when there is something to publish (and fork pull requests,
      # whose token is read-only, never attempt it).
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # mode=min on purpose: mode=max bloats the 10 GB repository cache.
          cache-from: type=gha
          cache-to: type=gha,mode=min
